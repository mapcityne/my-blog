---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: '%Y년 %-m월 %-d일' }}{% if page.updated %} · 최종 확인 {{ page.updated | date: '%Y년 %-m월 %-d일' }}{% endif %}</p>
  {% if page.summary %}<div class="summary"><strong>핵심 요약</strong><p>{{ page.summary }}</p></div>{% endif %}
  {{ content }}
</article>
<p class="back"><a href="{{ '/' | relative_url }}">← 전체 글 목록</a></p>
